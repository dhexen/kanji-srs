# Cada día mira si WaniKani tiene fichas sin notas en español, las traduce con Claude y las escribe.
# Secretos necesarios: WK_API_KEY (clave de WaniKani con study_materials:create/update) y
# CLAUDE_CODE_OAUTH_TOKEN (se genera con `claude setup-token`; usa tu suscripción de Claude).
name: WaniKani en español (diario)

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC
  workflow_dispatch:
    inputs:
      seco:
        description: 'Solo listar lo que falta, sin traducir ni escribir'
        type: boolean
        default: false

concurrency: wk-diario

jobs:
  traducir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Traducir y aplicar
        env:
          WK_API_KEY: ${{ secrets.WK_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WK_BACKUP_DIR: ${{ runner.temp }}/wk-backup
        run: node scripts/wk-diario.mjs ${{ inputs.seco && '--seco' || '' }}
      # La copia previa a escribir es la única forma de deshacer: WaniKani no lo permite.
      - name: Guardar copia de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wk-backup
          path: ${{ runner.temp }}/wk-backup
          retention-days: 30
          if-no-files-found: ignore
